[project]
name = "jarvis-bridge"
version = "0.1.0"
description = "Weekend-slice bridge from an Android phone to headless Claude Code."
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0",
    "kokoro>=0.7",
    "soundfile>=0.12",
]

[project.scripts]
jarvis-bridge = "bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]

[dependency-groups]
dev = ["pytest>=8.0"]
