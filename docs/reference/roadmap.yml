  - {item: "Bridge runs as a pod on the cluster, tailnet-only (Service + NetworkPolicy), verified (homelab#57, #59; drain fix #14 deployed with homelab#61)", status: done, evidence: "https://github.com/MWest2020/jarvis/blob/main/docs/how-to/run-in-cluster.md#test-on-2026-11-14"}
