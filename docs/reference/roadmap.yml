# Roadmap, as data, for the overview at westerweel.work/nu/. An item is "done" only with
# evidence (a PR, issue or doc); everything else is "open".
project: jarvis
goal: "Talk to a Claude Code session hands-free from an Android phone, on your own machines, over Tailscale."
current: weekend-test
phases:
  - {id: weekend-test, name: "Weekend test", summary: "spoken round trip from the phone (HTTP Shortcuts) to headless Claude Code, local STT/TTS"}
  - {id: plugin, name: "Plugin", summary: "machine side as a Claude Code plugin others can install"}
  - {id: android-app, name: "Android app", summary: "a native phone client built on the lessons of the test"}
done_means:
  - {item: "Change add-voice-bridge proposed (proposal, design, tasks, spec)", status: done, evidence: "https://github.com/MWest2020/jarvis/tree/main/openspec/changes/archive/2026-11-14-add-voice-bridge"}
  - {item: "Change approved by Mark (2026-11-14), his full tasks and spec in", status: done, evidence: "https://github.com/MWest2020/jarvis/pull/1"}
  - {item: "Bridge service on the tailnet with token, headless Claude Code, session resume", status: done, evidence: "https://github.com/MWest2020/jarvis/blob/main/docs/how-to/bridge-service.md#test-on-2026-11-14"}
  - {item: "Local STT (faster-whisper) and TTS (Kokoro) on the machine", status: done, evidence: "https://github.com/MWest2020/jarvis/blob/main/docs/how-to/bridge-service.md#test-on-2026-11-14"}
  - {item: "A spoken round trip from the phone over the tailnet (HTTP Shortcuts)", status: open, evidence: "https://github.com/MWest2020/jarvis/tree/main/openspec/changes/archive/2026-11-14-add-voice-bridge/tasks.md"}
  - {item: "Change run-bridge-in-cluster proposed (proposal, design, tasks, spec delta)", status: done, evidence: "https://github.com/MWest2020/jarvis/pull/8"}
  - {item: "Bridge runs as a pod on the cluster, tailnet-only (Service + NetworkPolicy), verified", status: done, evidence: "https://github.com/MWest2020/jarvis/blob/main/docs/how-to/run-in-cluster.md#test-on-2026-11-14"}
  - {item: "Change add-android-client proposed (proposal, design, tasks, spec), with the first version of the app", status: done, evidence: "https://github.com/MWest2020/jarvis/pull/12"}
  - {item: "Android app builds in CI: unit tests, lint, dependency check, debug APK artifact", status: done, evidence: "https://github.com/MWest2020/jarvis/pull/12/checks"}
  - {item: "Change add-android-client approved by Mark", status: open, evidence: "https://github.com/MWest2020/jarvis/pull/12"}
  - {item: "Android app: a spoken round trip on Mark's phone, recorded in the how-to", status: open, evidence: "https://github.com/MWest2020/jarvis/blob/main/docs/how-to/android-app.md#test-record"}
  - {item: "Android app: release-signed APK from CI (needs Mark's signing key as GitHub secrets)", status: open, evidence: "https://github.com/MWest2020/jarvis/blob/main/openspec/changes/add-android-client/tasks.md"}
