# The Android app (android/): unit tests, lint, the dependency check of design D9, and a
# debug APK as an artifact. A push to main signs it with the stable key from the repository
# secrets (jarvis#13), so an update installs over the old app; a pull request APK gets a
# per-run key and is for trying only
# (docs/how-to/android-app.md, "Updating").
name: android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      # Also checks gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The request, error mapping, WAV and press logic live in :core, plain Kotlin. This
      # step proves they can be tested on a machine without an Android SDK.
      - name: Core tests (no Android SDK)
        run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew --no-daemon :core:test

      # The stable signing key (jarvis#13), only for a push to main: those APKs are the
      # ones that are installed. Pull request APKs keep a per-run key. On main, a missing
      # secret fails the run instead of quietly shipping an APK that will not update.
      - name: Signing key
        if: github.event_name == 'push'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_B64 KS_PASS KEY_ALIAS KEY_PASS; do
            [ -n "${!v}" ] || { echo "::error::signing secret for $v is empty (docs/how-to/android-app.md, The signing key)"; exit 1; }
          done
          printf %s "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jarvis.jks"
          echo "JARVIS_KEYSTORE_FILE=$RUNNER_TEMP/jarvis.jks" >> "$GITHUB_ENV"

      - name: Lint, dependency check (D9), debug APK
        env:
          JARVIS_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          JARVIS_KEY_ALIAS: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_ALIAS || '' }}
          JARVIS_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ./gradlew --no-daemon check :app:assembleDebug

      # Which key signed the APK: on main it must be the stable one (jarvis#13).
      - name: Signing certificate
        run: |
          set -eu
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          cert=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "Signing certificate SHA-256: \`$cert\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$cert" != "$STABLE_CERT" ]; then
            echo "::error::main APK not signed with the stable key ($cert)"; exit 1
          fi
        env:
          STABLE_CERT: 49bca0d16a2a84fd3bbdf825147f924c8097414bf862e18cdc17ce9875b76d95

      # What the merged manifest really asks for and exposes, libraries included. Fails on
      # any Android permission beyond the three of design A9, and on any exported component
      # beyond the launcher activity and the DUMP-guarded profile receiver (jarvis#16;
      # the list and its reasons are in android/ci/check_exported.py).
      - name: Permissions and components in the APK
        run: |
          set -eu
          apk=app/build/outputs/apk/debug/app-debug.apk
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          perms=$("$aapt2" dump permissions "$apk")
          tree=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          {
            echo '### Permissions'; echo '```'; echo "$perms"; echo '```'
            echo '### Components (name, exported, permission)'; echo '```'
            echo "$tree" | grep -E 'E: (activity|activity-alias|service|receiver|provider)|A: .*android:(name|exported|permission|authorities)\(' \
              | sed -E 's/^ +//; s/\(0x[0-9a-f]+\)//; s/ \(Raw: .*//'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          extra=$(echo "$perms" | sed -n "s/^uses-permission: name='\(android\.permission\.[^']*\)'.*/\1/p" \
            | grep -v -x -E 'android\.permission\.(INTERNET|RECORD_AUDIO|ACCESS_NETWORK_STATE)' || true)
          if [ -n "$extra" ]; then echo "Unexpected permissions: $extra"; exit 1; fi
          echo "$tree" | python3 ci/check_exported.py

      - name: Name the APK
        id: apk
        run: |
          set -eu
          short=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          name="jarvis-debug-${GITHUB_RUN_NUMBER}-${short}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/$name"
          sum=$(sha256sum "$RUNNER_TEMP/$name" | cut -d' ' -f1)
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          echo "\`$name\` (debug build) sha256 \`$sum\`" >> "$GITHUB_STEP_SUMMARY"

      # On main the APK is kept for 90 days; on a pull request for a week, so a reviewer
      # can try the build under review.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jarvis-android-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}
