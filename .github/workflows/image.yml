# Tests, then the bridge image (deploy/Dockerfile): built on every PR, pushed to
# GHCR on main as ghcr.io/mwest2020/jarvis-bridge:<sha> and :sha-<short>.
# A deployment pins it by digest (docs/how-to/run-in-cluster.md). The package
# inherits this repo's visibility (private); GITHUB_TOKEN is enough to push it.
name: image
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.15"
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - run: shellcheck deploy/sync-projects.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/mwest2020/jarvis-bridge:${{ github.sha }}
            ghcr.io/mwest2020/jarvis-bridge:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha
      - if: github.event_name == 'push'
        run: echo "pushed ghcr.io/mwest2020/jarvis-bridge:${{ github.sha }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
